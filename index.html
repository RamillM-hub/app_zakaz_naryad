<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ЭлектроОптима — Заказ-наряд</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#F2F2F7;
    --card:#FFFFFF;
    --label:#1C1C1E;
    --secondary:#8E8E93;
    --tertiary:#C7C7CC;
    --separator:#E5E5EA;
    --accent:#2EA9E8;
    --accent-tint:#EAF7FE;
    --ink:#2E3A47;
    --danger:#FF3B30;
    --radius:14px;
    --sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  html,body{height:100%;}
  body{
    font-family:var(--sf);
    background:#0b0b0d;
    color:var(--label);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* ---------- Top bar (blurred, iOS nav) ---------- */
  .navbar{
    position:sticky; top:0; z-index:20;
    padding-top:env(safe-area-inset-top,0px);
    background:rgba(242,242,247,0.78);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    flex-shrink:0;
  }
  .navbar-inner{
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:0 12px;
  }
  .nav-title{
    font-size:15px;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--label);
    opacity:0;
    transform:translateY(4px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .nav-title.show{opacity:1;transform:translateY(0);}
  .nav-back{
    position:absolute; left:4px; top:0; bottom:0;
    display:flex; align-items:center; gap:2px;
    padding:0 8px;
    color:var(--accent);
    font-size:16.5px;
    font-weight:400;
    background:none; border:none; font-family:var(--sf);
  }
  .nav-back:active{opacity:0.4;}
  .nav-back svg{width:11px;height:18px;}
  .progress-track{height:2.5px;background:var(--separator);position:relative;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);transition:width .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- Scroll content ---------- */
  main{flex:1;overflow-y:auto;padding:0 16px 20px;-webkit-overflow-scrolling:touch;}
  .brand-row{
    display:flex; align-items:center; gap:9px;
    padding:16px 4px 2px;
    color:var(--ink);
    font-size:16px;
    font-weight:650;
    letter-spacing:0.005em;
  }
  .logo-mark{
    width:26px;height:26px;border-radius:50%;
    border:3.4px solid var(--accent);
    border-left-color:var(--ink); border-bottom-color:var(--ink);
    flex-shrink:0;
  }
  .large-title{
    font-size:32px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--label);
    padding:6px 4px 4px;
  }
  .large-sub{
    font-size:14px;
    color:var(--secondary);
    padding:2px 4px 18px;
    line-height:1.4;
  }

  .step-wrap{animation:iosIn .32s cubic-bezier(.22,1,.36,1);}
  @media (prefers-reduced-motion:reduce){ .step-wrap{animation:none;} }
  @keyframes iosIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Grouped card / list (Settings-style) ---------- */
  .group-label{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    color:var(--secondary);
    padding:0 16px 6px;
    margin-top:22px;
  }
  .group-label:first-child{margin-top:0;}
  .card{
    background:var(--card);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 1px 1px rgba(0,0,0,0.02);
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 16px;
    min-height:46px;
    position:relative;
    background:var(--card);
  }
  .row + .row{border-top:0.5px solid var(--separator);}
  .row.tappable{cursor:pointer;transition:background .1s;}
  .row.tappable:active{background:#F0F0F2;}
  .row-label{font-size:17px;color:var(--label);}
  .row-check{
    width:22px;height:22px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .row-check svg{width:22px;height:22px;display:none;}
  .row.selected .row-check svg{display:block;}
  .row.selected .row-label{color:var(--accent);font-weight:590;}

  .field-card{padding:10px 16px 12px;}
  .field-cap{font-size:13px;color:var(--secondary);margin-bottom:2px;}
  input[type=text], textarea{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-size:17px;
    color:var(--label);
    font-family:var(--sf);
    padding:2px 0;
  }
  textarea{resize:none;min-height:66px;line-height:1.35;}
  input::placeholder, textarea::placeholder{color:var(--tertiary);}
  .hint{font-size:12.5px;color:var(--secondary);padding:8px 4px 0;line-height:1.4;}

  .review-row .k{font-size:15px;color:var(--secondary);}
  .review-row .v{font-size:15px;color:var(--label);font-weight:590;text-align:right;max-width:60%;}

  .center-msg{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 16px 12px;gap:14px;}
  .check-badge{
    width:64px;height:64px;border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    animation:pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{0%{transform:scale(0.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .check-badge svg{width:30px;height:30px;}
  .center-msg h2{font-size:22px;font-weight:700;letter-spacing:-0.01em;color:var(--label);}
  .center-msg p{font-size:14.5px;color:var(--secondary);line-height:1.5;max-width:280px;}

  /* ---------- Bottom bar ---------- */
  footer{
    padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);
    background:rgba(242,242,247,0.78);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:0.5px solid var(--separator);
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:15px;
    font-weight:600;
    font-size:17px;
    font-family:var(--sf);
    letter-spacing:-0.01em;
    transition:transform .1s, opacity .1s;
  }
  .btn:active{transform:scale(0.98);opacity:0.85;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{background:var(--tertiary);}
  .btn-secondary{background:rgba(120,120,128,0.12);color:var(--accent);}
  .btn-plain{background:none;color:var(--accent);padding:8px;}

  .error-banner{
    background:#FFEBEA;color:var(--danger);font-size:13px;
    border-radius:10px;padding:10px 12px;margin-top:14px;display:none;
    text-align:center;
  }
  .error-banner.show{display:block;}

  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.45);border-top-color:#fff;
    animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:7px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="app">
  <div class="navbar">
    <div class="navbar-inner">
      <button class="nav-back" id="navBack" style="display:none;">
        <svg viewBox="0 0 11 18" fill="none"><path d="M10 1L2 9L10 17" stroke="#2EA9E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Назад
      </button>
      <div class="nav-title" id="navTitle">Заказ-наряд</div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <main id="mainArea"></main>

  <footer id="footerArea"></footer>
</div>

<script>
/* ===================== НАСТРОЙКИ ===================== */
const CONFIG = {
  API_URL: "ВСТАВЬТЕ_СЮДА_URL_ПОСЛЕ_ДЕПЛОЯ_APPS_SCRIPT",
};

/* ===================== СПРАВОЧНИКИ ===================== */
const EQUIP_TYPES = ["ТП", "РУНН 0,4 кВ", "РУСН 6–20 кВ", "Прочие"];
const EQUIP_SUBTYPES = {
  "ТП": ["БКТП", "БМЗ", "КТП"],
  "РУНН 0,4 кВ": ["НКУ", "ЩРНН", "Щитовое оборудование"],
  "РУСН 6–20 кВ": ["КРУ", "КСО", "RME-6"],
};

/* ===================== СОСТОЯНИЕ ===================== */
let step = "fio";
let data = {
  fio:"", surname:"", date: todayStr(), order:"",
  equipType:"", equipSubtype:"", equipManual:"", operation:"", time:"",
};
let opsCount = 0;

function todayStr(){
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
}

const mainArea = document.getElementById("mainArea");
const footerArea = document.getElementById("footerArea");
const navTitle = document.getElementById("navTitle");
const navBack = document.getElementById("navBack");
const progressFill = document.getElementById("progressFill");

const PROGRESS_STEPS = ["surname","date","order","equipType","operation","time"];
const BACK_MAP = { surname:"fio", date:"surname", order:"date", equipType:"order",
  equipSubtype:"equipType", operation:"equipSubtype", time:"operation", confirm:"time" };

function progressIndex(){
  if (step === "equipSubtype") return PROGRESS_STEPS.indexOf("equipType");
  if (step === "confirm" || step === "done") return PROGRESS_STEPS.length - 1;
  return PROGRESS_STEPS.indexOf(step);
}

function setNav(title){
  if (step === "fio" || step === "done"){
    navTitle.classList.remove("show");
    navBack.style.display = "none";
    progressFill.style.width = "0%";
    return;
  }
  navTitle.textContent = title;
  navTitle.classList.add("show");
  const target = BACK_MAP[step];
  navBack.style.display = target ? "flex" : "none";
  navBack.onclick = () => target && goTo(target);
  const idx = progressIndex();
  progressFill.style.width = ((idx+1)/PROGRESS_STEPS.length*100) + "%";
}

function goTo(next){ step = next; render(); mainArea.scrollTop = 0; }

/* ===================== РЕНДЕР ===================== */
function render(){
  mainArea.innerHTML = "";
  footerArea.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "step-wrap";
  mainArea.appendChild(wrap);

  if (step === "fio") return renderFio(wrap);
  if (step === "surname") return renderSurname(wrap);
  if (step === "date") return renderDate(wrap);
  if (step === "order") return renderOrder(wrap);
  if (step === "equipType") return renderEquipType(wrap);
  if (step === "equipSubtype") return renderEquipSubtype(wrap);
  if (step === "operation") return renderOperation(wrap);
  if (step === "time") return renderTime(wrap);
  if (step === "confirm") return renderConfirm(wrap);
  if (step === "done") return renderDone(wrap);
}

function brandRow(wrap){
  const b = document.createElement("div");
  b.className = "brand-row";
  b.innerHTML = '<span class="logo-mark"></span><span>ЭлектроОптима</span>';
  wrap.appendChild(b);
}

function largeTitle(wrap, title, sub){
  const h = document.createElement("div");
  h.className = "large-title";
  h.textContent = title;
  wrap.appendChild(h);
  if (sub){
    const s = document.createElement("div");
    s.className = "large-sub";
    s.textContent = sub;
    wrap.appendChild(s);
  }
}

function fieldCard(wrap, caption, inputEl){
  const card = document.createElement("div");
  card.className = "card field-card";
  const cap = document.createElement("div");
  cap.className = "field-cap";
  cap.textContent = caption;
  card.appendChild(cap);
  card.appendChild(inputEl);
  wrap.appendChild(card);
  return inputEl;
}

function checkSvg(){
  return '<svg viewBox="0 0 24 24" fill="none"><path d="M6 12.5L10 16.5L18 8" stroke="#2EA9E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function primaryBtn(label, onClick, disabled){
  const btn = document.createElement("button");
  btn.className = "btn btn-primary";
  btn.textContent = label;
  btn.disabled = !!disabled;
  btn.onclick = onClick;
  footerArea.appendChild(btn);
  return btn;
}
function secondaryBtn(label, onClick){
  const btn = document.createElement("button");
  btn.className = "btn btn-secondary";
  btn.textContent = label;
  btn.onclick = onClick;
  footerArea.appendChild(btn);
  return btn;
}

/* ---- ФИО ---- */
function renderFio(wrap){
  setNav("");
  navTitle.classList.remove("show");
  navBack.style.display = "none";
  progressFill.style.width = "0%";
  brandRow(wrap);
  largeTitle(wrap, "Заказ-наряд", "Укажите, кто заполняет — сохранится для всей сессии");
  const input = document.createElement("input");
  input.type = "text"; input.placeholder = "Иванов Иван Иванович"; input.value = data.fio;
  fieldCard(wrap, "ФИО", input);
  primaryBtn("Начать", () => {
    data.fio = input.value.trim();
    if (!data.fio) { input.focus(); return; }
    goTo("surname");
  });
  setTimeout(()=>input.focus(), 250);
}

/* ---- Фамилия ---- */
function renderSurname(wrap){
  setNav("Фамилия");
  brandRow(wrap);
  largeTitle(wrap, "Фамилия");
  const input = document.createElement("input");
  input.type = "text"; input.placeholder = "Иванов"; input.value = data.surname;
  fieldCard(wrap, "Фамилия исполнителя", input);
  primaryBtn("Далее", () => {
    data.surname = input.value.trim();
    if (!data.surname) { input.focus(); return; }
    goTo("date");
  });
  setTimeout(()=>input.focus(), 250);
}

/* ---- Дата ---- */
function renderDate(wrap){
  setNav("Дата");
  brandRow(wrap);
  largeTitle(wrap, "Дата");
  const input = document.createElement("input");
  input.type = "text"; input.placeholder = "19.11.2025"; input.value = data.date;
  fieldCard(wrap, "Дата (ДД.ММ.ГГГГ)", input);
  primaryBtn("Далее", () => {
    data.date = input.value.trim();
    if (!data.date) { input.focus(); return; }
    goTo("order");
  });
}

/* ---- Номер заказа ---- */
function renderOrder(wrap){
  setNav("Номер заказа");
  brandRow(wrap);
  largeTitle(wrap, opsCount === 0 ? "Номер заказа" : `Операция №${opsCount+1}`, opsCount===0?null:"Номер заказа");
  const input = document.createElement("input");
  input.type = "text"; input.placeholder = "7024 или 6692.1 ЦРП-2"; input.value = data.order;
  fieldCard(wrap, "Номер заказа", input);
  primaryBtn("Далее", () => {
    data.order = input.value.trim();
    if (!data.order) { input.focus(); return; }
    goTo("equipType");
  });
  setTimeout(()=>input.focus(), 250);
}

/* ---- Тип оборудования ---- */
function renderEquipType(wrap){
  setNav("Оборудование");
  brandRow(wrap);
  largeTitle(wrap, "Тип оборудования");
  const label = document.createElement("div");
  label.className = "group-label"; label.textContent = "Выберите тип"; label.style.marginTop="0";
  wrap.appendChild(label);
  const card = document.createElement("div"); card.className = "card";
  EQUIP_TYPES.forEach(type => {
    const row = document.createElement("div");
    row.className = "row tappable" + (data.equipType===type ? " selected" : "");
    row.innerHTML = `<span class="row-label">${type}</span><span class="row-check">${checkSvg()}</span>`;
    row.onclick = () => { data.equipType = type; data.equipSubtype=""; data.equipManual=""; goTo("equipType"); };
    card.appendChild(row);
  });
  wrap.appendChild(card);
  primaryBtn("Далее", () => { if (data.equipType) goTo("equipSubtype"); }, !data.equipType);
}

/* ---- Подтип / вручную ---- */
function renderEquipSubtype(wrap){
  setNav(data.equipType);
  if (data.equipType === "Прочие"){
    brandRow(wrap);
    largeTitle(wrap, "Оборудование", "Введите вручную");
    const input = document.createElement("input");
    input.type = "text"; input.placeholder = "Название оборудования"; input.value = data.equipManual;
    fieldCard(wrap, "Оборудование", input);
    primaryBtn("Далее", () => {
      data.equipManual = input.value.trim();
      if (!data.equipManual) { input.focus(); return; }
      goTo("operation");
    });
    setTimeout(()=>input.focus(), 250);
    return;
  }
  brandRow(wrap);
  largeTitle(wrap, data.equipType, "Выберите подтип");
  const card = document.createElement("div"); card.className = "card";
  EQUIP_SUBTYPES[data.equipType].forEach(sub => {
    const row = document.createElement("div");
    row.className = "row tappable" + (data.equipSubtype===sub ? " selected" : "");
    row.innerHTML = `<span class="row-label">${sub}</span><span class="row-check">${checkSvg()}</span>`;
    row.onclick = () => { data.equipSubtype = sub; goTo("equipSubtype"); };
    card.appendChild(row);
  });
  wrap.appendChild(card);
  primaryBtn("Далее", () => { if (data.equipSubtype) goTo("operation"); }, !data.equipSubtype);
}

/* ---- Операция ---- */
function renderOperation(wrap){
  setNav("Операция");
  brandRow(wrap);
  largeTitle(wrap, "Операция");
  const input = document.createElement("textarea");
  input.placeholder = "Электромонтаж БКТП"; input.value = data.operation;
  fieldCard(wrap, "Описание операции", input);
  primaryBtn("Далее", () => {
    data.operation = input.value.trim();
    if (!data.operation) { input.focus(); return; }
    goTo("time");
  });
  setTimeout(()=>input.focus(), 250);
}

/* ---- Время ---- */
function renderTime(wrap){
  setNav("Время");
  brandRow(wrap);
  largeTitle(wrap, "Время выполнения");
  const input = document.createElement("input");
  input.type = "text"; input.placeholder = "2,5 часа"; input.value = data.time;
  fieldCard(wrap, "Время на весь объём операции", input);
  const hint = document.createElement("div"); hint.className = "hint";
  hint.textContent = "Указывайте время на общее количество операций, а не на одну единицу.";
  wrap.appendChild(hint);
  primaryBtn("Далее", () => {
    data.time = input.value.trim();
    if (!data.time) { input.focus(); return; }
    goTo("confirm");
  });
  setTimeout(()=>input.focus(), 250);
}

/* ---- Подтверждение ---- */
function renderConfirm(wrap){
  setNav("Проверка");
  brandRow(wrap);
  largeTitle(wrap, "Проверьте данные", "Перед отправкой в таблицу");
  const equipment = data.equipType === "Прочие" ? data.equipManual : data.equipSubtype;
  const card = document.createElement("div"); card.className = "card";
  [["Фамилия", data.surname],["Дата", data.date],["Заказ", data.order],
   ["Оборудование", equipment],["Операция", data.operation],["Время", data.time]]
  .forEach(([k,v]) => {
    const row = document.createElement("div"); row.className = "row review-row";
    row.innerHTML = `<span class="k">${k}</span><span class="v">${escapeHtml(v)}</span>`;
    card.appendChild(row);
  });
  wrap.appendChild(card);

  const errorBanner = document.createElement("div");
  errorBanner.className = "error-banner"; errorBanner.id = "errorBanner";
  errorBanner.textContent = "Не удалось сохранить. Проверьте соединение и попробуйте снова.";
  wrap.appendChild(errorBanner);

  const btn = primaryBtn("Подтвердить", () => submitRow(btn));
}

function escapeHtml(str){ const d=document.createElement("div"); d.textContent=str; return d.innerHTML; }

async function submitRow(btn){
  const errorBanner = document.getElementById("errorBanner");
  errorBanner.classList.remove("show");
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Сохраняем…';

  const equipment = data.equipType === "Прочие" ? data.equipManual : data.equipSubtype;
  const payload = { fio:data.fio, surname:data.surname, date:data.date, order:data.order,
    equipment, operation:data.operation, time:data.time };

  try {
    const res = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("bad status");
    opsCount++;
    goTo("done");
  } catch (e) {
    errorBanner.classList.add("show");
    btn.disabled = false; btn.textContent = originalLabel;
  }
}

/* ---- Готово ---- */
function renderDone(wrap){
  setNav("");
  brandRow(wrap);
  const msg = document.createElement("div"); msg.className = "center-msg";
  msg.innerHTML = `
    <div class="check-badge"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>Операция добавлена</h2>
    <p>Заказ ${escapeHtml(data.order)} сохранён в таблице. Есть ещё операции по этому заказ-наряду?</p>
  `;
  wrap.appendChild(msg);

  secondaryBtn("Ещё операция", () => {
    data.order=""; data.equipType=""; data.equipSubtype=""; data.equipManual="";
    data.operation=""; data.time="";
    goTo("order");
  });
  primaryBtn("Завершить", () => {
    data = { fio:"", surname:"", date: todayStr(), order:"", equipType:"", equipSubtype:"", equipManual:"", operation:"", time:"" };
    opsCount = 0;
    goTo("fio");
  });
}

render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
